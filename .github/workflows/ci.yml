name: CI

on:
  push:
    branches: [main, "integrate/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify npm package and OAuth modes with OpenCode 2.1.2
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set +e
          node script/verify-package.mjs > verify-package.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 25 verify-package.log | while IFS= read -r line; do
              echo "::error::${line//$'\n'/ }"
            done
          else
            tail -n 3 verify-package.log
          fi
          exit "$status"
