name: Build Fork

# Build-only pipeline for forks: compiles the plugin, packs the tarball and,
# optionally, attaches it to a pre-release of this repository.
# It never publishes to npm, so it does not need NPM_TOKEN nor ownership of
# the upstream package name.

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Suffix for the release tag (default: fork.<run>)'
        required: false
        default: ''
        type: string
      create_release:
        description: 'Attach the package to a pre-release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-fork
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve build identity
        id: identity
        env:
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          SUFFIX="$LABEL"
          if [ -z "$SUFFIX" ]; then
            SUFFIX="fork.${{ github.run_number }}.${{ github.run_attempt }}"
          fi
          if ! [[ "$SUFFIX" =~ ^[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo "ERROR: label '$SUFFIX' is not a valid tag suffix (allowed: A-Z a-z 0-9 . -)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "Building $NAME@$VERSION as v${VERSION}-${SUFFIX} from $GITHUB_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: |
          rm -rf -- dist
          npm run build

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          [ -f dist/index.js ] || { echo "dist/index.js missing" >&2; exit 1; }
          [ -f dist/index.d.ts ] || { echo "dist/index.d.ts missing" >&2; exit 1; }
          [ -d dist/src ] || { echo "dist/src/ missing" >&2; exit 1; }

      - name: Pack release
        id: package
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          PACKAGE_NAME: ${{ steps.identity.outputs.package_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm pack --ignore-scripts --json --pack-destination artifacts > artifacts/pack.json
          TARBALL=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename' artifacts/pack.json)
          [ -f "artifacts/$TARBALL" ] || { echo "packed tarball not found" >&2; exit 1; }
          tar -xOf "artifacts/$TARBALL" package/package.json | node -e '
            const fs = require("node:fs")
            const p = JSON.parse(fs.readFileSync(0, "utf8"))
            if (p.name !== process.env.PACKAGE_NAME || p.version !== process.env.VERSION) {
              throw new Error("Packed name/version does not match the checked out package.json")
            }
          '
          echo "tarball=artifacts/$TARBALL" >> "$GITHUB_OUTPUT"
          echo "tarball_name=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "tarball_bytes=$(stat -c %s "artifacts/$TARBALL")" >> "$GITHUB_OUTPUT"
          echo "sha512=$(sha512sum "artifacts/$TARBALL" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Create dependency bundle
        id: bundle
        env:
          PACKAGE_NAME: ${{ steps.identity.outputs.package_name }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/bundle"
          rm -rf -- "$STAGE"
          mkdir -p "$STAGE"
          cd "$STAGE"
          printf '%s\n' '{"name":"opencode-plugin-bundle","private":true,"version":"0.0.0"}' > package.json
          npm install --omit=dev --no-audit --no-fund "$GITHUB_WORKSPACE/${{ steps.package.outputs.tarball }}"
          export INSTALLED="$STAGE/node_modules/$PACKAGE_NAME"
          [ -f "$INSTALLED/dist/index.js" ] || { echo "installed package is missing dist/index.js" >&2; exit 1; }
          node -e '
            const fs = require("node:fs")
            const path = require("node:path")
            const pkgDir = process.env.INSTALLED
            const pkg = JSON.parse(fs.readFileSync(path.join(pkgDir, "package.json"), "utf8"))

            // Mirror Node resolution without honouring package "exports":
            // several dependencies are ESM-only, so require.resolve() would fail
            // even when they are correctly installed.
            function findPackage(name) {
              let dir = pkgDir
              while (true) {
                const candidate = path.join(dir, "node_modules", name)
                if (fs.existsSync(path.join(candidate, "package.json"))) return candidate
                const parent = path.dirname(dir)
                if (parent === dir) return undefined
                dir = parent
              }
            }

            const missing = Object.keys(pkg.dependencies ?? {}).filter((name) => !findPackage(name))
            if (missing.length > 0) {
              console.error("Missing dependencies in bundle: " + missing.join(", "))
              process.exit(1)
            }
            const installed = fs.readdirSync(path.join(pkgDir, "..", ".."))
            console.log(
              "bundle OK: " + pkg.name + "@" + pkg.version + " with " +
              Object.keys(pkg.dependencies ?? {}).length + " declared and all dependencies present in " +
              path.join(pkgDir, "..", "..")
            )
            console.log("top-level node_modules entries: " + installed.length)
          '
          BUNDLE_NAME="${PACKAGE_NAME}-${VERSION}-bundle.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/artifacts/$BUNDLE_NAME" -C "$STAGE" node_modules
          cd "$GITHUB_WORKSPACE"
          echo "bundle=artifacts/$BUNDLE_NAME" >> "$GITHUB_OUTPUT"
          echo "bundle_name=$BUNDLE_NAME" >> "$GITHUB_OUTPUT"
          echo "bundle_sha512=$(sha512sum "artifacts/$BUNDLE_NAME" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "bundle_bytes=$(stat -c %s "artifacts/$BUNDLE_NAME")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.tag }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.bundle.outputs.bundle }}
          if-no-files-found: error
          retention-days: 90

      - name: Write release notes
        if: github.event.inputs.create_release == 'true'
        id: notes
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
          PACKAGE_NAME: ${{ steps.identity.outputs.package_name }}
          TARBALL_NAME: ${{ steps.package.outputs.tarball_name }}
          TARBALL_BYTES: ${{ steps.package.outputs.tarball_bytes }}
          SHA512: ${{ steps.package.outputs.sha512 }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.bundle_name }}
          BUNDLE_SHA512: ${{ steps.bundle.outputs.bundle_sha512 }}
          BUNDLE_BYTES: ${{ steps.bundle.outputs.bundle_bytes }}
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          {
            echo "## Build ${TAG}"
            echo ""
            echo "Test build of \`${VERSION}\` from commit ${GITHUB_SHA} (\`${GITHUB_REF_NAME}\`). Not published to npm."
            echo ""
            echo "| Asset | Size | SHA-512 |"
            echo "| --- | --- | --- |"
            echo "| \`${TARBALL_NAME}\` (npm package) | ${TARBALL_BYTES} bytes | \`${SHA512}\` |"
            echo "| \`${BUNDLE_NAME}\` (package + node_modules) | ${BUNDLE_BYTES} bytes | \`${BUNDLE_SHA512}\` |"
            echo ""
            echo "### Install without npm/node (recommended)"
            echo ""
            printf '%s\n' '```bash'
            echo "mkdir -p ~/opt/oc-antigravity"
            echo "curl -L -o /tmp/bundle.tar.gz https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${BUNDLE_NAME}"
            echo "tar -xzf /tmp/bundle.tar.gz -C ~/opt/oc-antigravity"
            printf '%s\n' '```'
            echo ""
            echo "Then in \`~/.config/opencode/opencode.json\`:"
            echo ""
            printf '%s\n' '```json'
            echo "{"
            echo "  \"\$schema\": \"https://opencode.ai/config.json\","
            echo "  \"plugins\": [\"/home/USER/opt/oc-antigravity/node_modules/${PACKAGE_NAME:-opencode-antigravity-auth}\"]"
            echo "}"
            printf '%s\n' '```'
            echo ""
            echo "### Install with npm"
            echo ""
            printf '%s\n' '```bash'
            echo "npm install -g https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${TARBALL_NAME}"
            printf '%s\n' '```'
            echo ""
            echo "A path entry is not touched by the plugin auto-updater. Log in once with \`opencode auth login google\`."
          } > "$BODY_FILE"
          {
            echo "body<<EOF"
            cat "$BODY_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cat "$BODY_FILE"

      - name: Create pre-release
        if: github.event.inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
          BODY: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: release $TAG already exists; use a different label" >&2
            exit 1
          fi
          printf '%s\n' "$BODY" > release-notes.md
          gh release create "$TAG" "$TARBALL" "$BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build $VERSION ($TAG)" \
            --notes-file release-notes.md \
            --prerelease

      - name: Summary
        run: |
          {
            echo "### Build ${{ steps.identity.outputs.tag }}"
            echo "- Package: \`${{ steps.identity.outputs.package_name }}@${{ steps.identity.outputs.version }}\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Asset: \`${{ steps.package.outputs.tarball_name }}\`"
            echo "- Bundle: \`${{ steps.bundle.outputs.bundle_name }}\` (${{ steps.bundle.outputs.bundle_bytes }} bytes)"
            echo "- SHA-512 (tarball): \`${{ steps.package.outputs.sha512 }}\`"
            echo "- SHA-512 (bundle): \`${{ steps.bundle.outputs.bundle_sha512 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
